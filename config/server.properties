# jootm2-server configuration
# HTTP admin + WebSocket game share a single NIO port.

# Listen port for HTTP (admin) and WebSocket (game)
server.port=8080

# Number of NIO selector (reactor) threads. Each thread multiplexes thousands of
# connections with a single java.nio.channels.Selector (io multiplexing).
server.ioThreads=2

# Acceptor backlog
server.backlog=256

# SQLite database file (relative to working directory)
db.file=data/jootm2.db

# Game tick interval in milliseconds (movement/monster/combat updates)
game.tickMs=100

# Save player data to SQLite every N seconds
game.savePeriodSec=30

# Web content root (frontend static files, relative to working directory)
web.root=frontend

# Legend of Mir resource root (Data/Map/Wav/resources.json, relative to working directory)
resources.root=resources

# URL prefix used to serve resources
resources.prefix=/resources

# Server game data root (mud2/DB Paradox tables -> SQLite on first boot)
gamedata.root=gamedata

# Game world defaults used when no map data exists yet
world.width=200
world.height=200
world.playerSpawnX=100
world.playerSpawnY=100