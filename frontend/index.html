<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>传奇 MIR2</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #111;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #stage {
            position: relative;
            width: 800px;
            height: 600px;
        }
        /* 游戏场景层（canvas 轮询绘制） */
        #screen {
            position: absolute;
            left: 0;
            top: 0;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        /* GUI 层（DOM 多窗体，覆盖在 canvas 上） */
        #gui {
            position: absolute;
            left: 0;
            top: 0;
            width: 800px;
            height: 600px;
            pointer-events: none;   /* 容器不拦截，由控件自身 div 拦截 */
        }
        #gui .d-control {
            pointer-events: auto;   /* 控件自身可交互 */
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="stage">
        <canvas id="screen" width="800" height="600"></canvas>
        <div id="gui"></div>
    </div>
    <script type="module" src="./main.mjs"></script>
</body>
</html>
